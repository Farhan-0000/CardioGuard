[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "medbridge"
version = "4.0.0"
description = "MedBridge (CardioGuard) - evidence-grounded clinical guidance with a Dual Answerability Gate"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.143.0",
    "uvicorn[standard]==0.54.0",
    "pydantic==2.14.0",
    "pydantic-settings==2.15.0",
    "sqlalchemy[asyncio]==2.1.4",
    "asyncpg==0.32.0",
    "alembic==1.20.0",
    "psycopg2-binary==2.9.13",
    "qdrant-client==1.19.1",
    "fastembed==0.9.0",
    "sentence-transformers==6.1.0",
    "httpx==0.28.1",
    "streamlit==1.65.0",
    "pymupdf==1.28.2",
    "structlog==26.1.0",
    "cryptography==50.0.2",
]

[project.optional-dependencies]
test = [
    "scikit-learn",
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "pytest-cov==7.1.0",
    "pytest-timeout==2.4.0",
]
eval = [
    "numpy==2.4.6",
    "scipy==1.17.1",
    "matplotlib==3.11.2",
    "openpyxl==3.1.5",
]
report = [
    "python-docx==1.2.0",
    "python-pptx==1.0.2",
    "playwright==1.63.0",
]
dev = [
    "ruff==0.16.10",
    "mypy==2.4.0",
]

[tool.setuptools.packages.find]
include = ["medbridge*", "evaluation*"]

[tool.setuptools.package-data]
"medbridge.web" = ["*.html", "css/*.css", "js/*.js", "js/ui/*.js", "img/*.svg"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["medbridge/tests", "tests"]
markers = [
    "postgres: needs a running PostgreSQL (skipped automatically when unreachable)",
    "qdrant: needs a running Qdrant with the indexed corpus (skipped when unreachable)",
    "ollama: needs a running Ollama server with the configured model (skipped when unreachable)",
    "live: end-to-end test against live services; excluded unless -m live is given",
    "slow: long-running test",
]
addopts = "-m 'not live'"
filterwarnings = [
    "ignore::DeprecationWarning:swig.*",
]

[tool.coverage.run]
source = ["medbridge", "evaluation"]
omit = ["medbridge/tests/*", "*/__main__.py"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [".venv", ".venv-mac", "alembic/versions", "report/build"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "ASYNC", "RUF"]
ignore = ["E501", "B008", "RUF001", "RUF002", "RUF003", "RUF012"]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["B", "RUF", "E402", "F401", "F811", "F403"]
"tests/**" = ["B", "RUF", "E402", "F401", "F811", "F403"]

[tool.mypy]
python_version = "3.11"
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_defs = true
check_untyped_defs = true
no_implicit_optional = true
exclude = ["medbridge/tests/", "^tests/", "alembic/", "report/"]
