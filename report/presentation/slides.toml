[[slides]]
id = "retrieval"
kicker = "Knowledge base and retrieval"
title = "Curated knowledge base and measured retrieval quality"
kpis = [
  { value = "{{corpus.totals.documents|int}}", label = "curated documents (open access, licence checked)" },
  { value = "{{corpus.totals.organisations|int}}", label = "issuing organisations (AHA/ACC, ESC, NICE, WHO, ...)" },
  { value = "{{corpus.totals.chunks|comma}}", label = "indexed chunks, at most {{corpus.totals.chunk_tokens.max|int}} tokens each" },
  { value = "{{retrieval.modes.hybrid.n|int}}", label = "labelled evaluation queries (lay and clinical)" },
]
notes = """
The knowledge base grew from three PDF guidelines at Review 3 to {{corpus.totals.documents|int}} curated documents from {{corpus.totals.organisations|int}} organisations: {{corpus.totals.pdf_documents|int}} PDFs and {{corpus.totals.html_documents|int}} HTML pages, {{corpus.totals.chunks|comma}} chunks in total. Every document is pinned in data/corpus_manifest.json with its source, licence and checksum; nothing is scraped. Chunks are at most {{corpus.totals.chunk_tokens.max|int}} tokens so that no text falls outside the embedder's window, which was a real problem in the old index.

Retrieval was evaluated on {{retrieval.modes.hybrid.n|int}} labelled queries. The table gives Recall at 5 and 20, MRR and nDCG at 5, each with a 95 per cent bootstrap confidence interval. Hybrid fusion is the configuration the pipeline uses; the rows below it are the reranker ablation, where four cross-encoders rerank the same top-20 hybrid candidates.

Read the takeaway line honestly: on this set the confidence intervals overlap, so no reranker is significantly better than fusion alone. We kept the small MiniLM cross-encoder because it is the fastest, it is part of the approved architecture, and its score doubles as the quantitative evidence signal of the calibrated Evidence Gate variant (V1).
"""

# ---------------------------------------------------------------------------------------------
[[slides]]
id = "privacy"
kicker = "Privacy and security"
title = "Privacy by design: patient data never leaves the machine"
cards = [
  { title = "Redact", tone = "safe", text = "Deterministic PII/PHI rules before any model call and before storage; BP values, doses and labs are kept" },
  { title = "Encrypt", tone = "storage", text = "A random data key per session, wrapped by a master key from the environment (Fernet: AES-128-CBC + HMAC-SHA256)" },
  { title = "Erase", tone = "emergency", text = "Right to erasure by crypto-shredding: deleting the session key makes even append-only rows unreadable" },
  { title = "Control access", tone = "det", text = "HMAC-signed expiring session tokens, admin login, rate limits, body-size limit, CSP and security headers" },
  { title = "Stay local", tone = "llm", text = "LOCAL_ONLY_MODE: only a loopback Ollama is allowed; remote providers are refused" },
]
notes = """
Privacy was a deferred limitation at Review 1; it is now a layer of its own (Figure 3.x, privacy flow, in the report).

Redaction is deterministic and runs before any model call and before anything is stored. It is careful not to touch clinical values: BP readings, doses, lab values and drug names survive. Storage is encrypted per session: each session gets its own data key, wrapped by a master key that only lives in the environment. That is what makes erasure possible in an append-only design: deleting the session key ("crypto-shredding") makes every stored ciphertext of that session unreadable, including the immutable audit and event rows, and the API then answers 410 for that session. Access control uses signed, expiring session tokens; and in local-only mode a non-loopback model host is refused outright.

The table reports redaction quality. The development set was written alongside the detector, so its scores are in-sample. The blind held-out set was written by a different author who never saw the detector, and it was evaluated once with the detector frozen: strict precision {{pii.datasets.blind_v2.results.all.overall_strict.precision|f3}}, recall {{pii.datasets.blind_v2.results.all.overall_strict.recall|f3}}. The weak spot is names without a cue (blind-set name recall {{pii.datasets.blind_v2.results.all.per_category_strict.NAME.recall|f3}}); structured identifiers carry over well, and no clinical value was corrupted on either set.
"""

