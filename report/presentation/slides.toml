[[slides]]
id = "problem"
kicker = "Problem and motivation"
title = "Hypertension is common, and generic chatbots answer anyway"
stats = [
  { value = "≈ 1 in 3", label = "adults worldwide live with hypertension", cite = "[@who2023globalreport]", tone = "emergency" },
  { value = "≈ 1.3 billion", label = "people affected; the number doubled from 1990 to 2019", cite = "[@who2023globalreport; @ncdrisc2021hypertension]", tone = "emergency" },
  { value = "≈ 4 in 5", label = "people with hypertension are not adequately treated", cite = "[@who2023globalreport]", tone = "gate" },
  { value = "35.5 %", label = "of Indian adults aged 20 and above have hypertension", cite = "[@anjana2023indiab]", tone = "gate" },
]
risks_title = "Why an unguarded chatbot is unsafe here"
risks = [
  "**Hallucination survives grounding:** the best of twelve clinical RAG pipelines still hallucinated in 5.8 % of answers [@wolk2025ragcds]",
  "**Unsafe personalisation:** a correct guideline fact applied without knowing the patient's kidney disease, pregnancy or medicines",
  "**Missed emergencies:** a probabilistic generator cannot guarantee that “BP 200/120 and chest pain” is escalated",
  "**Brand-name fragility:** swapping brand and generic drug names cost LLMs about 1–10 % accuracy [@gallifant2024rabbits]",
  "**Privacy:** sending health conversations to a cloud API creates obligations under India's DPDP Act [@dpdp2023india]",
]
notes = """
Start with the burden. WHO's first global report on hypertension estimates that about one adult in three is affected, that the number of people with hypertension doubled to roughly 1.3 billion between 1990 and 2019, and that about four in five are not adequately treated. The NCD Risk Factor Collaboration's pooled analysis of 1,201 population studies shows the same doubling. In India the ICMR-INDIAB survey estimated a prevalence of 35.5 per cent among adults aged 20 and above.

Most of these people make day-to-day decisions alone: is this reading dangerous, is the dizziness from my new tablet, what should I eat. Chatbots look like the ideal always-available explainer, but they fail in specific ways (right column).

Hallucination does not disappear with retrieval: in a comparison of twelve clinical RAG pipelines the best one still hallucinated in 5.8 per cent of answers. Unsafe personalisation is subtler: the fact is correct, the patient is wrong for it. Emergencies need a guarantee, not a probability. Brand names matter in India, where patients name their medicines by brand. And cloud APIs conflict with the privacy of health data.

All numbers on this slide come from the cited, verified references (report/references/references.json); none are our measurements.
"""

