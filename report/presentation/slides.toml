id = "emergency"
kicker = "Safety layer"
title = "Emergency fast-path and natural-language robustness"
how_title = "Deterministic emergency triage"
how = [
  "Runs on the **raw** message before redaction or any LLM call: rules only, no model, no network",
  "Lay phrasing and formats: “150 over 95”, “chest feels tight”, “can't move my arm”",
  "Negation and context: “no chest pain”, educational and historical mentions pass through",
  "Typo tolerance plus a Hinglish and Indian-English lexicon",
  "Time budget under 10 ms, enforced by a unit test on 2,000-character messages",
]
examples = [
  { text = "my chest feels really tight and my left arm went numb", expected = "ESCALATE" },
  { text = "face drooping and slurred speech since 10 minutes", expected = "ESCALATE" },
  { text = "dard nahi hai lekin bp 200/120 hai", expected = "ESCALATE" },
  { text = "no chest pain, my bp was 128/82 this morning", expected = "PASS-THROUGH" },
  { text = "I had a stroke two years ago, what BP target should I aim for?", expected = "PASS-THROUGH" },
  { text = "seene mein dard nahi hai", expected = "PASS-THROUGH" },
]
nl_title = "Robust to how patients actually write"
nl = [
  "Brand → generic: {{deck.drugs.brands|int}} brand names, {{deck.drugs.indian_brands|int}} of them Indian (e.g. Telma → telmisartan)",
  "Lay → clinical query expansion (“water pill” → thiazide diuretic)",
  "BP parser tells readings from targets (“is 130/80 my target?”)",
  "Recent turns go to the extractor for follow-ups like “is that dose ok?”",
]
notes = """
The emergency fast-path is the one place where we do not trust a language model at all. It is a deterministic classifier that reads the raw message, before redaction and before any LLM call, so an emergency is escalated even if Ollama is down.

It understands everyday phrasings and number formats, handles negation (“no chest pain” does not escalate), ignores educational and historical mentions, tolerates typos, and has a Hinglish and Indian-English lexicon. The examples at the top right were run through the real classifier when this deck was built; the right-hand column shows its actual output.

The table on the right runs the classifier over the two labelled case files: {{deck.emergency.english.cases|int}} English messages and {{deck.emergency.hinglish.cases|int}} Hinglish messages. Say clearly that these files were written alongside the rules, so the result is in-sample: it shows the intended phrasings are covered, not real-world accuracy. The independent estimate is the emergency recall on the HalluBench test split, shown underneath once the study has run.

The classifier is deliberately biased toward recall: questions that name a red flag, such as whether beta-blockers can cause shortness of breath, are escalated, which is its main known source of false positives.

The bottom panel lists the natural-language work in the rest of the pipeline: brand-to-generic normalisation, lay-to-clinical query expansion, a BP parser that does not mistake a target for a reading, and conversation history for follow-up questions.
"""

