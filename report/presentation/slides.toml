Testing has three layers. Hermetic unit tests fake every LLM call and cover the five routes, the loop-breaker, template bypass, emergency-before-LLM ordering, every fallback, speculative retrieval semantics, citation downgrade and the ablation switches. Integration tests run against a real PostgreSQL test database and the live Qdrant collection. On top of that come the end-to-end smoke test against a running server, and the benchmark harnesses on the previous slides.

The tiles: the current test-run summary is read from reports/test_summary.json (or JUnit XML) when it exists; the received prototype's baseline from reports/baseline/pytest_baseline.txt; the smoke test from reports/smoke_test_latest.json. The test inventory on the left is a static count of test functions in the source, so parametrised cases make the executed number larger.

Before the final experiments the integrated system went through an adversarial code review: each proposed defect was checked independently three times and only unanimously confirmed findings were accepted. {{deck.code_review.confirmed|int}} findings were confirmed and all were fixed in commit {{deck.code_review.commit}} with regression tests. The high-severity ones would have biased the study, for example degraded turns counted as non-hallucinated, or a vector-store outage logged as an empty retrieval, which would have favoured the gated conditions.
"""

