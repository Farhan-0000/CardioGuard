Introduce the team and the guide. The project is presented as CardioGuard; the software system inside it is called MedBridge, and we use that name for everything technical.

One-sentence pitch: MedBridge is a consultation assistant for hypertension and wider cardiovascular care that runs entirely on a local machine, and before it writes any answer it decides whether it is entitled to answer at all.

Point to the five chips on the right: every patient message ends in exactly one of these five actions. Three of them (ANSWER, SOFT-ASK, GENERALIZE) produce generated text grounded in guideline passages; two of them (ABSTAIN, ESCALATE) never call the text generator and return pre-vetted templates.

Roadmap: problem, gap and objectives, architecture and the two gates, emergency handling, retrieval, privacy, the user interface, the evaluation design and results, robustness, performance, testing, and finally limitations.

