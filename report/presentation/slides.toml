  { name = "V1", text = "C5 + calibrated Evidence Gate", tone = "note" },
  { name = "V2", text = "C5 + Gate 3 grounding verifier", tone = "note" },
]
judges = [
  "**LLM judge** ({{deck.judges.llm_judge_model}}, a different model family from the app model): splits each answer into atomic claims, labels each SUPPORTED, UNSUPPORTED or CONTRADICTED",
  "**NLI judge** ({{deck.judges.nli_model}}): deterministic check of the same claims against corpus passages",
  "Agreement: Cohen's κ between judges; a 50-item human sheet for the team",
]
stats = [
  "Hallucination rate, unsafe-answer rate on unanswerable items, coverage, routing macro-F1, emergency recall",
  "Wilson 95 % CIs · exact McNemar (C5 vs each) with Holm correction · Cochran's Q · risk difference and odds ratio",
]
notes = """
MedBridge-HalluBench is our synthetic benchmark: {{hallubench.n_items|int}} items with {{hallubench.n_turns|int}} turns in six categories, from answerable questions with complete context to unanswerable questions about fabricated drugs, false premises and doses that no guideline states, plus out-of-domain and emergency items. No real patient data is used. A stratified 20 per cent development split ({{hallubench.by_split.dev|int}} items) is used only for calibration; every reported number comes from the {{hallubench.by_split.test|int}}-item test split.

The ablation runs the same application model, retrieval and prompts under each condition. C0 to C2 are the baselines promised in the specification: direct LLM, vanilla RAG and RAG with safety instructions in the prompt. C3 and C4 switch on one gate each; C5 is the full system. V1 and V2 are the two extensions from the decision rule: a calibrated Evidence Gate and a post-generation grounding verifier.

Hallucination is judged twice, independently: an LLM judge from a different model family (to avoid self-preference) labels atomic claims, and a deterministic NLI cross-encoder checks the same claims. We report agreement between them as Cohen's kappa, and the team will label a 50-item human sheet. Statistics are paired: exact McNemar tests of C5 against each other condition with Holm correction, Cochran's Q across conditions, and effect sizes with confidence intervals.
"""

