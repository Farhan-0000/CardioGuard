[[slides]]
id = "evaluation"
kicker = "Evaluation design"
title = "How we measure hallucination: HalluBench, ablation, two judges"
conditions = [
  { name = "C0", text = "Direct LLM, no retrieval", tone = "det" },
  { name = "C1", text = "Vanilla RAG", tone = "det" },
  { name = "C1G", text = "RAG + production prompt", tone = "det" },
  { name = "C2", text = "RAG + prompt-only safety", tone = "det" },
  { name = "C3", text = "Context Gate only", tone = "gate" },
  { name = "C4", text = "Evidence Gate only", tone = "gate" },
  { name = "C5", text = "MedBridge: both gates", tone = "gate" },
  { name = "V1", text = "C5 + calibrated Gate 2", tone = "note" },
  { name = "V2", text = "C5 + Gate 3 verifier", tone = "note" },
  { name = "V12", text = "V1 + V2", tone = "note" },
]
judges = [
  "**LLM judge** ({{deck.judges.llm_judge_model}}, another family than the app model) on every condition: atomic claims labelled SUPPORTED, UNSUPPORTED or CONTRADICTED",
  "**NLI judge** ({{deck.judges.nli_model}}) re-labels them; concluded early, it scored only {{deck.stats.nli_reported}} completely, so it serves agreement only",
  "Cohen's κ {{study.judge_agreement.kappa_response_hallucination|cif:3}} on {{study.judge_agreement.n_responses|int}} paired responses; AI annotator (not human) vs LLM judge κ {{ai_annotation.ai_vs_llm.kappa_3class.kappa|f2}}",
]
stats = [
  "Hallucination rate, unsafe-answer rate on unanswerable items, coverage, routing macro-F1, emergency recall",
  "Wilson 95 % CIs · exact McNemar (C5 vs each) with Holm correction · Cochran's Q · risk difference and odds ratio",
]
notes = """
MedBridge-HalluBench is our synthetic benchmark: {{hallubench.n_items|int}} items with {{hallubench.n_turns|int}} turns in six categories, from answerable questions with complete context to unanswerable questions about fabricated drugs, false premises and doses that no guideline states, plus out-of-domain and emergency items. No real patient data is used. A stratified 20 per cent development split ({{hallubench.by_split.dev|int}} items) is used only for model selection and calibration; every hallucination-study result comes from the {{hallubench.by_split.test|int}}-item test split.

The ablation runs the same application model, corpus, retriever and benchmark under every condition. The generator prompt differs by design: C0 answers directly with no retrieval, C1 uses a vanilla RAG prompt, C2 adds a prose safety block, and C1G, C3-C5 and the variants use the production grounded prompt. C0 to C2 are the baselines promised in the specification. C1G (production prompt, no gates) is the reference that separates the prompt change from the gates. C3 and C4 switch on one gate each; C5 is the full system. V1, V2 and their combination V12 are the extensions from the decision rule: a calibrated Evidence Gate and a post-generation grounding verifier.

Hallucination is judged by an LLM judge from a different model family (to avoid self-preference), which splits each answer into atomic claims and labels them, on every condition. A deterministic NLI cross-encoder re-labels those same claims against the same evidence. By the project owner's decision the NLI judge was concluded early to save compute: it scored {{deck.stats.nli_reported}} completely, only part of C2 and none of the gated conditions. It is therefore used only for inter-judge agreement, and every rate, interval and test in the results uses the LLM judge. The two judges are not independent (the NLI judge reuses the LLM judge's claims, and its thresholds were calibrated on the dev split to agree with it), so the response-level kappa of {{study.judge_agreement.kappa_response_hallucination|cif:3}} shows consistency on ungated outputs, not independent confirmation. A blinded 50-item human annotation sheet has been exported; the team still has to label it. Statistics are paired: exact McNemar tests with Holm correction, Cochran's Q across C0 to C5, and effect sizes with confidence intervals.
"""

