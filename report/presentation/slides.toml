notes = """
Thank the panel and the guide. Invite questions.

Likely questions and where the answers are (docs/DEMO_SCRIPT.md has full answers):
1. Why two gates instead of one? Different information at different times; the ablation (C3, C4) measures each gate, and the Evidence Gate carries most of the effect.
2. How was hallucination measured? Atomic claims judged by an LLM judge from another model family on all {{deck.stats.n_conditions|int}} conditions; an NLI judge re-labelled the claims of the ungated conditions for agreement (response-level kappa {{study.judge_agreement.kappa_response_hallucination|cif:3}}); no human labels were collected, but an AI annotator (not a human) labelled {{ai_annotation.n_claims|comma}} claims of a 50-item sample and agreed with the LLM judge at κ {{ai_annotation.ai_vs_llm.kappa_3class.kappa|f2}}, while finding answered C5 and C1 responses about equally often unsupported.
3. Did the gate work? Yes by the rule fixed in advance: C5 significantly reduced hallucination and unsafe answers against vanilla RAG and prompt-only safety. Mostly by asking or declining, not by better-grounded answers.
4. Why is Gate 3 on if it shortens answers? It significantly reduced hallucination against C5, and we applied the brief's rule for a winning variant (on by default behind a flag); the coverage cost is real and is our first piece of future work.
5. Why local models? Privacy of health data and a free, reproducible setup sized for a 6 GB GPU (not yet run on the demo laptop).
6. What happens if the LLM fails? Every failure degrades to a safe response: Gate 1 to PROCEED, Gate 2 to GENERALIZE, the generator to a template, an unavailable verifier keeps the draft and records it; emergencies caught by the deterministic fast-path never depend on the LLM.
7. Can the emergency check be bypassed by prompt injection? No: it runs on the raw text before any model and its result cannot be overruled; the live adversarial suite passed {{adversarial.counts.passed|int}} of {{adversarial.counts.payloads|int}} payloads.
8. Individual contributions: [TO BE FILLED: contribution split between the two students].
"""
