notes = """
Be candid here; the panel rewards it.

The benchmarks are synthetic and were written by one author with AI assistance, so the gold labels have not been checked by clinicians and absolute rates may not transfer to real patients. Only one judge scored every condition: the NLI judge was concluded early to save compute, covers {{deck.stats.nli_reported}} only, and serves the agreement check; every rate, interval and test uses the LLM judge. The 50-item human annotation sheet has been exported but not yet labelled.

Post-study changes. Three commits came after the hallucination study, which (like the AQ run) evaluated the code before them: the brand-name robustness fix prompted by live RABBITS (02d9774), Gate 3 enabled by default with the dev-calibrated thresholds (7a3bc67), and the rule that withdraws a draft whose every claim is unsupported (16e594b; in the V2 test run this case occurred in {{deck.gate3_withdrawal.turns|int}} turns, {{deck.gate3_withdrawal.hallucinated|int}} of them judged hallucinated). RABBITS (Gate 3 off) and the adversarial suite (Gate 3 on) were re-run after the fix, both before 16e594b; the study and AQ were not, so the effect of these changes on the benchmark is not measured. A fourth change landed during the study: a process-wide PyTorch inference lock (3f58b59), added after Gate 3 and the reranker crashed the evaluation process on Apple MPS when they ran at the same time; the V2 and V12 runs were produced entirely on it.

Gate 3 makes answers shorter: it reduces hallucination largely by removing sentences ({{study.per_condition.V2.llm.claims_per_response|f1}} vs {{study.per_condition.C5.llm.claims_per_response|f1}} claims per response), stripped answers can begin mid-thought, and a question such as “My blood pressure was 145/92 this morning. Is that high?” can come back as a single sentence. The small local models that fit the demo GPU route imperfectly: C5 routed {{study.per_condition.C5.routing_system.accuracy_strict|pct}} of test turns exactly right, and AQ routing was {{aq.metrics.overall_routing_accuracy|perc}} against a target of {{deck.robust.aq_targets.routing_accuracy|int}}%. One local Ollama server serialises concurrent users. The rule-based redactor misses names without a cue, although such identifiers never leave the machine and are encrypted at rest. Some major guidelines could not be downloaded, so heart failure and coronary disease are thinly covered. The system is a single-node research prototype, the text is streamed only after the turn is complete, it has not been tested by us on the Windows RTX 4050 laptop, and it is not a medical device.

The future-work list answers these limitations one by one: rewrite instead of strip, a better verifier with re-calibration and a re-run on the final code, clinician validation and human labels, statistically calibrated abstention, stronger name detection and key management, real streaming, regional languages and a proper user study.
"""

