[[slides]]
id = "gap"
kicker = "Research gap and objectives"
title = "The gap: RAG never decides whether it should answer"
gap_title = "What existing approaches leave open"
gap = [
  "Standard RAG retrieves and generates for every query: there is no explicit point at which it declines [@lewis2020rag]",
  "Self-reflective and corrective RAG judge the **evidence**, not whether the **patient context** is sufficient [@asai2024selfrag; @yan2024crag]",
  "Abstention research still has open gaps in how declining to answer is evaluated [@wen2025abstention]",
  "Flagship medical LLMs such as Med-PaLM are large, closed models that cannot be run privately on local hardware [@singhal2023llmclinical]",
]
reasons = [
  { title = "“I don't know enough about you”", text = "Patient context is missing → ask first (SOFT-ASK), **before** retrieval" },
  { title = "“I don't have enough evidence”", text = "Guideline evidence is thin → generalise or abstain, **after** retrieval" },
]
objectives_title = "Objectives"
objectives = [
  "Dual Answerability Gate: Context Gate before retrieval, Evidence Gate after it",
  "Deterministic emergency fast-path before any LLM call, under 10 ms",
  "Curated cardiology knowledge base with hybrid retrieval and reranking",
  "Grounded, cited generation; templates for ABSTAIN and ESCALATE",
  "Privacy by design: redaction, encryption, erasure, local-only inference",
  "HalluBench study: C0–C5, the C1G reference and V1, V2, V12; LLM judge on all, NLI judge for agreement; paired tests",
  "Local operation sized for a 6 GB GPU; latency measured before and after (on the Apple M5)",
  "Transparent web interface and an automated test suite",
]
notes = """
Retrieval-augmented generation pairs a model with a retriever, and it is the natural starting point for a guideline assistant. But in its standard form it retrieves and generates for every query. Later work such as Self-RAG and Corrective RAG adds critique of the retrieved evidence, yet nothing asks whether the system knows enough about the patient to apply that evidence safely. A survey of abstention also points to open gaps in how declining to answer is evaluated.

Our observation is that there are two different reasons to hold back, shown in the two amber boxes. The first is about the patient and is best checked before retrieval: if a fact that would change the safe answer is missing, ask for it. The second is about the evidence and can only be checked after retrieval: if the passages do not support a specific answer, generalise or abstain. MedBridge makes both decisions explicit as two separate gates, with a deterministic emergency check in front of both.

The eight objectives on the right are the ones in Chapter 1 of the report, each with a measurable criterion; the remaining slides follow them in order.
"""

# ---------------------------------------------------------------------------------------------
[[slides]]
id = "architecture"
kicker = "System design"
title = "Architecture: two gates before the answer, a grounding check after it"
figure = "report/figures/architecture_pipeline.png"
stages = [
  { n = "0", name = "Privacy redaction", text = "deterministic PII/PHI rules; redacted text feeds every later stage", tone = "safe" },
  { n = "1", name = "Emergency fast-path", text = "rules on the raw message, no LLM, before any LLM call → ESCALATE template", tone = "emergency" },
  { n = "2", name = "Session state, small talk", text = "event-sourced snapshot and soft-ask counter; greetings by template", tone = "det" },
  { n = "3", name = "Context extraction", text = "LLM → typed clinical events + search query; snapshot = fold(events)", tone = "llm" },
  { n = "4", name = "Context Gate (Gate 1)", text = "SOFT-ASK or PROCEED; after {{deck.config.SOFT_ASK_MAX_COUNT|int}} asks in a row the loop-breaker forces GENERALIZE", tone = "gate" },
  { n = "5", name = "Hybrid retrieval", text = "dense + BM25 → RRF (k = 60) → top {{deck.config.RETRIEVAL_TOP_K_CANDIDATES|int}} → cross-encoder → top {{deck.config.RETRIEVAL_TOP_K_RERANKED|int}}; runs speculatively with Gate 1", tone = "storage" },
  { n = "6", name = "Evidence Gate (Gate 2)", text = "ANSWER, GENERALIZE, ABSTAIN or ESCALATE", tone = "gate" },
  { n = "7", name = "Grounded generation", text = "XML-isolated input, validated [n] citations; ABSTAIN and ESCALATE use templates", tone = "llm" },
  { n = "7b", name = "Gate 3 verifier", text = "local NLI model checks each sentence against its cited chunks and strips unsupported ones; on by default since the study", tone = "gate" },
  { n = "8", name = "Persistence", text = "one encrypted flush per turn; append-only events and audit log", tone = "storage" },
]
notes = """
Walk the pipeline top to bottom; the full diagram on the left is Figure 3.1 of the report, and the colours are the same in every diagram: amber for the gates, red for the emergency path, blue for calls to the local LLM, grey for deterministic code, green for templates and privacy controls, purple for storage.

Stage 0 redacts personal identifiers before anything else. Stage 1, the emergency fast-path, reads the raw text with deterministic rules and escalates immediately, with no model call. Stage 3 asks the LLM to extract typed clinical events such as BP readings and medicines; the patient snapshot is a fold over those events and is never written by the model directly.

Gate 1 decides whether the patient context is sufficient: SOFT-ASK or PROCEED, and after two consecutive SOFT-ASKs the loop-breaker forces a general answer so the patient is never trapped. Retrieval fuses dense and BM25 results with reciprocal rank fusion and reranks with a cross-encoder; it starts speculatively alongside Gate 1 and is discarded if Gate 1 asks a question, so routing is unchanged. Gate 2 decides whether the evidence supports an answer. Only ANSWER, GENERALIZE and SOFT-ASK reach the generator; ABSTAIN and ESCALATE return pre-vetted templates. Every turn is persisted in one encrypted flush with an immutable audit record.

Stage 7b, Gate 3, is the grounding verifier. It started as the study's V2 variant (the amber box after generation in the figure) and, because V2 significantly reduced hallucination against C5, it is now enabled by default with the thresholds calibrated on the development split (commit 7a3bc67; entailment threshold {{deck.config.GROUNDING_ENTAILMENT_THRESHOLD|f1}}, maximum unsupported fraction {{deck.config.GROUNDING_MAX_UNSUPPORTED_FRACTION|f1}}). It uses a different NLI model ({{deck.config.GROUNDING_NLI_MODEL}}) from the study's NLI judge. Gate 3 can only remove sentences or make a reply more conservative: since commit 16e594b a draft whose every checked claim is unsupported is regenerated as GENERALIZE and, failing that, withdrawn as ABSTAIN.

Defaults shown here are read from medbridge/config.py at build time.
"""

# ---------------------------------------------------------------------------------------------
[[slides]]
id = "gate"
kicker = "Core contribution"
title = "The Dual Answerability Gate: five actions, one per message"
columns = ["Action", "Decided by", "When", "What the patient gets", "Generator called?"]
rows = [
  ["ANSWER", "Evidence Gate", "Context is sufficient and the evidence specifically answers this question for this patient", "Grounded answer with validated [n] citations", "Yes"],
  ["SOFT-ASK", "Context Gate", "A personal fact that would change the safe answer is missing", "One focused follow-up question", "Yes"],
  ["GENERALIZE", "Evidence Gate or loop-breaker", "Evidence covers the topic only in general, or a false belief needs correcting; or {{deck.config.SOFT_ASK_MAX_COUNT|int}} SOFT-ASKs in a row", "Non-personalised guideline information with citations", "Yes"],
  ["ABSTAIN", "Evidence Gate", "Outside cardiovascular care, an unknown (possibly fabricated) drug, or a dose the evidence does not state", "Pre-vetted refusal with a referral", "No: template"],
  ["ESCALATE", "Emergency fast-path, or Evidence Gate", "Red flags happening now: chest pain, stroke signs; fast-path: a reading with systolic ≥ 180 or diastolic ≥ 120 when BP is mentioned (a bare number pair must meet both); Gate 2: 180/120 or more with symptoms", "Emergency template: seek care now", "No: template"],
]
strip = [
  "Both gates: temperature 0, seed 42, JSON-schema outputs",
  "Every gate decision and rationale goes to an append-only audit log",
  "Never-throw fallbacks: Gate 1 fails → PROCEED · Gate 2 fails → GENERALIZE · generator fails → template",
  "An ANSWER left with no valid citation is downgraded to GENERALIZE",
]
notes = """
This is the novel part. Each message ends in exactly one of five actions, and the table says who decides and when.

The Context Gate runs before retrieval and only chooses between asking and proceeding. It asks only when three things hold together: the question is about the patient's own cardiovascular care, a specific personal fact would change the safe answer, and that fact is missing. The loop-breaker caps this at two consecutive questions and then gives a general answer.

The Evidence Gate runs after retrieval with four outcomes and applies the first rule that fits: escalate an emergency happening now; abstain when the topic is outside cardiovascular care, when a named drug or product does not appear in the evidence (it may not exist), or when a specific dose or number is not stated; generalise when the evidence is only general or a false belief must be corrected; answer only when the evidence answers this question for this patient.

The design guarantees in the strip are what make the system auditable: deterministic decoding for the gates, structured outputs, a logged rationale for every decision, and fallbacks that always degrade to something safe. Likely viva question: why two gates and not one? Because the two checks need different information at different times: the patient check must happen before retrieval, the evidence check can only happen after it. The ablation conditions C3 and C4 measure each gate on its own.
"""

