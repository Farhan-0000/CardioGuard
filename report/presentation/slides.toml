notes = """
This slide answers two questions: why is Gate 3 on by default, and what does it cost?

The decision. §6.7's fallback procedure says to integrate the winning variant behind a flag, on by default; the fallback was not triggered because C5 won, but we applied the same rule to the V2 extension. V2, the dual gate plus Gate 3, reduced response-level hallucination significantly against C5 ({{deck.stats.mcnemar.V2_vs_C5.hallucination.risk_difference|pp}}, Holm p = {{deck.stats.mcnemar.V2_vs_C5.hallucination.pvalue_holm|p}}); its unsafe-answer reduction was not significant. So Gate 3 was enabled by default in commit 7a3bc67, with the thresholds calibrated on the dev split: entailment threshold {{deck.config.GROUNDING_ENTAILMENT_THRESHOLD|f1}} and maximum unsupported fraction {{deck.config.GROUNDING_MAX_UNSUPPORTED_FRACTION|f1}}. With that fraction Gate 3 itself never changed an action in the study, but in {{deck.gate3_withdrawal.citation_downgrades|int}} of the {{deck.gate3_withdrawal.checked|int}} turns it checked, it stripped every validly cited sentence and the citation rule then downgraded ANSWER to GENERALIZE. Two cautions: only one judge scored V2 (the NLI judge never did), and the threshold was tuned for agreement with that same judge on a small dev set.

What the effect consists of (table). Among replies that make claims, V2 is hallucinated in {{study.per_condition.V2.llm.hallucination_given_claims|pct}} against {{study.per_condition.C5.llm.hallucination_given_claims|pct}} for C5, but its replies are about half as long ({{study.per_condition.V2.llm.claims_per_response|f1}} vs {{study.per_condition.C5.llm.claims_per_response|f1}} claims per response) and the share of unsupported claims barely moves. Gate 3 reduces hallucination largely by shortening answers. Coverage of answerable turns drops from {{study.per_condition.C5.coverage_answerable|pct}} to {{study.per_condition.V2.coverage_answerable|pct}}.

What we saw after the study. In a manual check on the final code, the question “My blood pressure was 145/92 this morning. Is that high?” came back as a one-sentence GENERALIZE answer: Gate 3 stripped five of the six claims at θ = {{deck.config.GROUNDING_ENTAILMENT_THRESHOLD|f1}}, the remaining sentence carried no citation, and the citation rule then downgraded ANSWER to GENERALIZE. Stripped answers can also begin mid-thought when an opening sentence is removed. The study runs already show the same downgrade in {{deck.gate3_withdrawal.citation_downgrades|int}} V2 test turns; it is the usefulness side of the same trade-off. The fixes we propose are to rewrite unsupported sentences instead of deleting them, to use a stronger NLI model, and to re-calibrate on a larger dev set.

One more post-study change, found by reading the code: in the study, a draft in which every checked claim was unsupported was delivered unchanged when stripping would have left nothing ({{deck.gate3_withdrawal.unchanged|int}} of the {{deck.gate3_withdrawal.turns|int}} cases), and otherwise reduced to its unchecked non-claim sentences. Commit 16e594b now regenerates such an ANSWER as GENERALIZE and otherwise withdraws it as ABSTAIN. In the V2 test run this case occurred in {{deck.gate3_withdrawal.turns|int}} of the {{deck.gate3_withdrawal.checked|int}} turns Gate 3 checked, and the LLM judge rated {{deck.gate3_withdrawal.hallucinated|int}} of them hallucinated. The effect of this fix on the benchmark was not re-measured.
"""
