[[slides]]
id = "performance"
kicker = "Technical refinement"
title = "Performance: from cold starts to a warm, overlapped pipeline"
optimisations = [
  "**Warm-up at start-up:** embedders, reranker and LLMs loaded before the first patient turn; models kept resident",
  "**Speculative retrieval:** overlaps with Gate 1 and is discarded on SOFT-ASK, so routing is unchanged",
  "**Concurrent encoding and caching:** dense and sparse encoders in parallel; embeddings and results cached",
  "**Structured outputs:** grammar-constrained JSON removes repair loops; thinking disabled, outputs bounded",
  "**One database flush per turn** instead of five or more; persistent HTTP client",
  "**Deterministic shortcuts:** small talk and erased sessions never reach a model",
]
notes = """
Review 3 reported latencies in the tens of seconds, and our own baseline confirmed that model loading dominated cold turns. The table on the left is the baseline measured on the received code with the latency probe (scripts/latency_probe.py), one cold pass and three warm passes over the five Review-3 scenarios. The "after" column is filled from the matching probe of the final system; until that file exists it shows a pending marker rather than an estimate.

The optimisations on the right were made without changing routing. The most important are warm-up at start-up, which removes the cold-start penalty, and speculative retrieval: retrieval only depends on the extractor's search query, so it can run while Gate 1 decides; if Gate 1 asks a question, the retrieved passages are simply discarded, so Gate 1 still fully controls whether they are used. Every trace records how much time speculation saved.

Honest limitation: each LLM turn still takes several seconds because the extractor, two gates and the generator are sequential model calls on a small local GPU.

Regenerate the table and its figure with python -m evaluation.perf once both probe files exist.
"""

