notes = """
Three robustness checks, all against the live pipeline with the application model; mock-mode reports are ignored by the builder.

MedBridge-AQ is the routing benchmark from the original specification, rebuilt with {{deck.aq.vignettes|int}} vignettes; each starts a fresh session with its context seeded as typed clinical events. It ran once, at commit {{deck.robust.aq_after.commit}}, before the brand-name fix ({{deck.robust.aq_after.gate3_label}} in the run header), and was not re-run. It missed the routing target (accuracy {{aq.metrics.overall_routing_accuracy|perc}} against at least {{deck.robust.aq_targets.routing_accuracy|int}}%) and the citation target (precision {{aq.metrics.overall_citation_precision|perc}} against at least {{deck.robust.aq_targets.citation_precision|int}}%, a macro-average over the {{aq.metrics.citation_evaluated|int}} vignettes that returned citations and list expected sources). Emergency recall was {{aq.metrics.emergency_detection_recall|perc}} ({{aq.metrics.emergency_detected_count|int}} of {{aq.metrics.emergency_count|int}}, all by the deterministic fast-path) and no out-of-domain vignette got an ANSWER. Out-of-domain ANSWER is a routing proxy, not a hallucination judgement.

RABBITS asks the same two questions with a brand name and with its generic name and checks that the action, the stored medicine and the citations stay the same; this matters in India, where patients name medicines by brand. The first live run showed real fragility: same action in {{deck.robust.rabbits_before.action_consistency_pct|perc}} of items, and the brand stored as its generic in only {{deck.robust.rabbits_before.brand_normalised_pct|perc}}; Gate 2 abstained on real brands because the guidelines use generic names. Commit 02d9774 fixed this with lexicon drug reference notes for the extractor, both gates and the generator, a deterministic current-medication backstop and a search-query drug filter. After the fix: same action {{rabbits.action_consistency_pct|perc}} ({{rabbits.by_origin.indian.action_consistency_pct|perc}} for Indian brands), stored generic consistent in {{rabbits.extraction_consistency_pct|perc}}. The run headers record {{deck.robust.rabbits_before.gate3_label}} before and {{deck.robust.rabbits_after.gate3_label}} after, so the change reflects the brand fix rather than Gate 3. The fix came after the hallucination study, so the study measured the code before it.

The adversarial suite sends injection and jailbreak payloads and scores the replies with deterministic checks for leaked prompts, fabricated prescriptions and unsafe output: {{deck.robust.adversarial_before.counts.passed|int}} of {{deck.robust.adversarial_before.counts.payloads|int}} passed before the fix ({{deck.robust.adversarial_before.gate3_label}}) and {{adversarial.counts.passed|int}} of {{adversarial.counts.payloads|int}} after it ({{deck.robust.adversarial_after.gate3_label}}). All runs were made from working trees with uncommitted changes; the commits are the closest recorded ones.

The hermetic part of the security evaluation runs in the normal test suite: input isolation, tag neutralisation, the fast-path ordering and SQL injection through the REST API.
"""

